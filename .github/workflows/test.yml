name: test
# Every PR and every push to main: the offline suite, the launcher's own test included — a change
# that breaks the controller's start should never reach main.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # the tests are the PR's code
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
