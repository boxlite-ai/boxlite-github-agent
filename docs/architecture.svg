<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="t">
  <title id="t">GitHub mentions reach the controller box by polling or App push. The controller holds every real credential, calls chatgpt.com with the real login, and runs one session box per issue or PR. Session boxes hold no credentials, reach the model only through the controller, and keep their context on a shared volume.</title>
  <style>
    :root { --bg: #ffffff; --frame: #d1d9e0; --ink: #1f2328; --muted: #59636e; --rule: #d1d9e0; --rule-strong: #818b98; --bubble: #f6f8fa; --blue: #0969da; --blue-soft: #ddf4ff; --amber: #9a6700; --amber-soft: #fff8c5; --green: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151b23; --frame: #3d444d; --ink: #f0f6fc; --muted: #9198a1; --rule: #3d444d; --rule-strong: #656c76; --bubble: #0d1117; --blue: #4493f8; --blue-soft: #102a4c; --amber: #d29922; --amber-soft: #2e2410; --green: #3fb950; }
    }
    text { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; }
    .small { font-size: 12px; }
    .muted { fill: var(--muted); }
    .key { fill: var(--blue); font-weight: 600; }
    .blue { fill: var(--blue); font-weight: 600; }
    .amber { fill: var(--amber); }
    .ok { fill: var(--green); font-weight: 600; }
    .frame { fill: var(--bg); stroke: var(--frame); }
    .ext { fill: var(--bg); stroke: var(--rule-strong); stroke-width: 1.2; }
    .trusted { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.6; }
    .untrusted { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.6; stroke-dasharray: 6 4; }
    .card { fill: var(--bg); stroke: var(--rule-strong); }
    .bubble { fill: var(--bubble); stroke: var(--rule); }
    .hair { stroke: var(--rule); }
    .edge { stroke: var(--ink); stroke-width: 1.4; fill: none; }
    .dot { stroke: var(--ink); stroke-width: 1.4; fill: none; stroke-dasharray: 2 4; }
    .secret { stroke: var(--blue); stroke-width: 1.6; fill: none; }
    .token { stroke: var(--amber); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .ah { fill: var(--ink); }
    .ah-blue { fill: var(--blue); }
    .ah-amber { fill: var(--amber); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-amber" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="939" height="479" rx="12"/>

  <!-- GitHub -->
  <rect class="ext" x="16" y="70" width="180" height="180" rx="10"/>
  <text class="title" x="106" y="98" text-anchor="middle">GitHub</text>
  <text class="small muted" x="106" y="118" text-anchor="middle">public issue or PR</text>
  <rect class="bubble" x="26" y="132" width="160" height="46" rx="8"/>
  <text class="small" x="106" y="151" text-anchor="middle">@boxliteai why does</text>
  <text class="small" x="106" y="168" text-anchor="middle">this test fail?</text>
  <text class="small muted" x="106" y="208" text-anchor="middle">+ BoxLite Agent App</text>
  <text class="small muted" x="106" y="224" text-anchor="middle">(optional, your repos)</text>

  <!-- controller -->
  <rect class="trusted" x="296" y="40" width="340" height="236" rx="12"/>
  <text class="title" x="466" y="68" text-anchor="middle">controller box</text>
  <text class="small muted" x="466" y="86" text-anchor="middle">always on · holds every real credential</text>
  <text x="316" y="118"><tspan class="key">poller</tspan><tspan class="muted"> · notifications, every 60 s</tspan></text>
  <text x="316" y="146"><tspan class="key">webhook</tspan><tspan class="muted"> · App repos, ~1 s</tspan></text>
  <text x="316" y="174"><tspan class="key">scheduler</tspan><tspan class="muted"> · 1 per thread, 3 at once</tspan></text>
  <text x="316" y="202"><tspan class="key">model proxy</tspan><tspan class="muted"> · job token → real login</tspan></text>
  <line class="hair" x1="316" y1="220" x2="616" y2="220"/>
  <text class="small" x="316" y="244">keeps: bot GitHub token · BoxLite key</text>
  <text class="small" x="316" y="262">ChatGPT device login (refreshed here)</text>

  <!-- chatgpt.com -->
  <rect class="ext" x="748" y="108" width="176" height="84" rx="10"/>
  <text class="title" x="836" y="142" text-anchor="middle">chatgpt.com</text>
  <text class="muted" x="836" y="164" text-anchor="middle">Codex backend</text>

  <!-- session boxes -->
  <rect class="untrusted" x="296" y="340" width="340" height="124" rx="12"/>
  <text class="title" x="466" y="366" text-anchor="middle">session boxes · one per issue / PR</text>
  <text class="small muted" x="466" y="384" text-anchor="middle">no credentials · Codex, every permission</text>
  <rect class="card" x="306" y="398" width="98" height="48" rx="7"/>
  <text x="355" y="418" text-anchor="middle">acme/app#7</text>
  <text class="small ok" x="355" y="435" text-anchor="middle">running</text>
  <rect class="card" x="417" y="398" width="98" height="48" rx="7"/>
  <text x="466" y="418" text-anchor="middle">you/cli#12</text>
  <text class="small muted" x="466" y="435" text-anchor="middle">stopped</text>
  <rect class="card" x="528" y="398" width="98" height="48" rx="7"/>
  <text x="577" y="418" text-anchor="middle">org/api#40</text>
  <text class="small muted" x="577" y="435" text-anchor="middle">stopped</text>

  <!-- shared volume -->
  <rect class="ext" x="748" y="352" width="176" height="100" rx="10"/>
  <text class="title" x="836" y="380" text-anchor="middle">shared volume</text>
  <text class="muted" x="836" y="400" text-anchor="middle">botlite-context</text>
  <text class="small" x="836" y="421" text-anchor="middle">sessions/owner/repo/n/</text>
  <text class="small amber" x="836" y="438" text-anchor="middle">context.sealed</text>

  <!-- GitHub ⇄ controller -->
  <line class="edge" x1="196" y1="122" x2="294" y2="122" marker-end="url(#ah)"/>
  <text class="small" x="246" y="114" text-anchor="middle">poll ≤ 60 s</text>
  <line class="dot" x1="196" y1="160" x2="294" y2="160" marker-end="url(#ah)"/>
  <text class="small" x="246" y="152" text-anchor="middle">push ~1 s</text>
  <line class="edge" x1="296" y1="206" x2="198" y2="206" marker-end="url(#ah)"/>
  <text class="small" x="246" y="198" text-anchor="middle">👀 + reply</text>

  <!-- controller → chatgpt.com -->
  <line class="secret" x1="636" y1="150" x2="746" y2="150" marker-end="url(#ah-blue)"/>
  <text class="small blue" x="692" y="142" text-anchor="middle">real login</text>

  <!-- controller ⇄ session boxes -->
  <line class="edge" x1="420" y1="276" x2="420" y2="338" marker-end="url(#ah)"/>
  <text class="small" x="410" y="302" text-anchor="end">exec runner, attached</text>
  <text class="small muted" x="410" y="318" text-anchor="end">prompt in · events out</text>
  <line class="token" x1="540" y1="340" x2="540" y2="278" marker-end="url(#ah-amber)"/>
  <text class="small amber" x="550" y="302">model calls</text>
  <text class="small muted" x="550" y="318">+ per-job token</text>

  <!-- session boxes ⇄ volume -->
  <line class="edge" x1="636" y1="402" x2="746" y2="402" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="small" x="692" y="394" text-anchor="middle">seal · restore</text>
</svg>
