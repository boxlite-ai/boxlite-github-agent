<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-labelledby="t">
  <title id="t">GitHub mentions reach the controller box by polling or App push, and Slack messages over a Socket Mode connection the controller dials out. The controller holds every real credential, calls chatgpt.com as the bot and Linear, Notion and Google Workspace as the Slack requester, and runs one session box per GitHub thread or Slack requester within a thread. Session boxes hold no credentials and reach the model, the tools and (on a write turn) one staging branch of the bot's fork only through the controller. GitHub threads and Slack threads never mix: each side keeps its context on a volume of its own, and a GitHub box never mounts Slack's.</title>
  <style>
    :root { --bg: #ffffff; --frame: #d1d9e0; --ink: #1f2328; --muted: #59636e; --rule: #d1d9e0; --rule-strong: #818b98; --bubble: #f6f8fa; --blue: #0969da; --blue-soft: #ddf4ff; --amber: #9a6700; --amber-soft: #fff8c5; --green: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151b23; --frame: #3d444d; --ink: #f0f6fc; --muted: #9198a1; --rule: #3d444d; --rule-strong: #656c76; --bubble: #0d1117; --blue: #4493f8; --blue-soft: #102a4c; --amber: #d29922; --amber-soft: #2e2410; --green: #3fb950; }
    }
    text { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; }
    .small { font-size: 12px; }
    .muted { fill: var(--muted); }
    .key { fill: var(--blue); font-weight: 600; }
    .blue { fill: var(--blue); font-weight: 600; }
    .amber { fill: var(--amber); }
    .wall { fill: var(--amber); font-weight: 600; }
    .ok { fill: var(--green); font-weight: 600; }
    .frame { fill: var(--bg); stroke: var(--frame); }
    .ext { fill: var(--bg); stroke: var(--rule-strong); stroke-width: 1.2; }
    .trusted { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.6; }
    .untrusted { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.6; stroke-dasharray: 6 4; }
    .card { fill: var(--bg); stroke: var(--rule-strong); }
    .bubble { fill: var(--bubble); stroke: var(--rule); }
    .hair { stroke: var(--rule); }
    .divide { stroke: var(--amber); stroke-width: 1.4; stroke-dasharray: 2 3; }
    .label-bg { fill: var(--amber-soft); }
    .edge { stroke: var(--ink); stroke-width: 1.4; fill: none; }
    .dot { stroke: var(--ink); stroke-width: 1.4; fill: none; stroke-dasharray: 2 4; }
    .secret { stroke: var(--blue); stroke-width: 1.6; fill: none; }
    .token { stroke: var(--amber); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .ah { fill: var(--ink); }
    .ah-blue { fill: var(--blue); }
    .ah-amber { fill: var(--amber); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-amber" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="939" height="639" rx="12"/>

  <!-- GitHub -->
  <rect class="ext" x="16" y="40" width="180" height="136" rx="10"/>
  <text class="title" x="106" y="66" text-anchor="middle">GitHub</text>
  <text class="small muted" x="106" y="84" text-anchor="middle">public issue or PR</text>
  <rect class="bubble" x="26" y="94" width="160" height="44" rx="8"/>
  <text class="small" x="106" y="112" text-anchor="middle">@boxliteai why does</text>
  <text class="small" x="106" y="129" text-anchor="middle">this test fail?</text>
  <text class="small muted" x="106" y="160" text-anchor="middle">+ App push (optional)</text>

  <!-- Slack -->
  <rect class="ext" x="16" y="200" width="180" height="136" rx="10"/>
  <text class="title" x="106" y="226" text-anchor="middle">Slack</text>
  <text class="small muted" x="106" y="244" text-anchor="middle">channel or DM</text>
  <rect class="bubble" x="26" y="254" width="160" height="44" rx="8"/>
  <text class="small" x="106" y="272" text-anchor="middle">@boxliteai why does</text>
  <text class="small" x="106" y="289" text-anchor="middle">CI fail? 📎 ci.log</text>
  <text class="small muted" x="106" y="320" text-anchor="middle">Socket Mode, no URL</text>

  <!-- controller -->
  <rect class="trusted" x="296" y="40" width="340" height="296" rx="12"/>
  <text class="title" x="466" y="68" text-anchor="middle">controller box</text>
  <text class="small muted" x="466" y="86" text-anchor="middle">always on · holds every real credential</text>
  <text x="316" y="116"><tspan class="key">poller</tspan><tspan class="muted"> · GitHub, every 60 s</tspan></text>
  <text x="316" y="140"><tspan class="key">webhook</tspan><tspan class="muted"> · App repos, ~1 s</tspan></text>
  <text x="316" y="164"><tspan class="key">socket</tspan><tspan class="muted"> · Slack events, ~1 s</tspan></text>
  <text x="316" y="188"><tspan class="key">scheduler</tspan><tspan class="muted"> · 1 per session, 3 at once</tspan></text>
  <text x="316" y="212"><tspan class="key">proxy</tspan><tspan class="muted"> · model, tools, one git push</tspan></text>
  <line class="hair" x1="316" y1="230" x2="616" y2="230"/>
  <text class="small" x="316" y="254">keeps: GitHub token · push App key</text>
  <text class="small" x="316" y="272">Slack tokens · BoxLite · Linear keys</text>
  <text class="small" x="316" y="290">ChatGPT · Notion · Google logins</text>
  <text class="small muted" x="316" y="318">tools: Slack turns, admins' on GitHub</text>

  <!-- chatgpt.com -->
  <rect class="ext" x="748" y="64" width="176" height="76" rx="10"/>
  <text class="title" x="836" y="96" text-anchor="middle">chatgpt.com</text>
  <text class="muted" x="836" y="118" text-anchor="middle">Codex backend</text>

  <!-- the team's tools -->
  <rect class="ext" x="748" y="172" width="176" height="72" rx="10"/>
  <text class="title" x="836" y="202" text-anchor="middle">Linear · Notion</text>
  <text class="muted" x="836" y="224" text-anchor="middle">Google Workspace</text>

  <!-- session boxes: GitHub's and Slack's, apart -->
  <rect class="untrusted" x="296" y="392" width="340" height="224" rx="12"/>
  <text class="title" x="466" y="416" text-anchor="middle">isolated session boxes</text>
  <text class="small muted" x="466" y="434" text-anchor="middle">no credentials · Codex, every permission</text>
  <text class="small muted" x="306" y="456">GitHub · anyone's, public repos</text>
  <rect class="card" x="306" y="464" width="98" height="42" rx="7"/>
  <text x="355" y="482" text-anchor="middle">acme/app#7</text>
  <text class="small ok" x="355" y="498" text-anchor="middle">running</text>
  <rect class="card" x="417" y="464" width="98" height="42" rx="7"/>
  <text x="466" y="482" text-anchor="middle">you/cli#12</text>
  <text class="small muted" x="466" y="498" text-anchor="middle">stopped</text>
  <rect class="card" x="528" y="464" width="98" height="42" rx="7"/>
  <text x="577" y="482" text-anchor="middle">org/api#40</text>
  <text class="small muted" x="577" y="498" text-anchor="middle">stopped</text>
  <line class="divide" x1="306" y1="524" x2="626" y2="524"/>
  <rect class="label-bg" x="420" y="515" width="92" height="18"/>
  <text class="small wall" x="466" y="528" text-anchor="middle">never mixed</text>
  <text class="small muted" x="306" y="548">Slack · per requester within each thread</text>
  <rect class="card" x="306" y="556" width="98" height="42" rx="7"/>
  <text x="355" y="574" text-anchor="middle">#backend</text>
  <text class="small ok" x="355" y="590" text-anchor="middle">running</text>
  <rect class="card" x="417" y="556" width="98" height="42" rx="7"/>
  <text x="466" y="574" text-anchor="middle">DM · alice</text>
  <text class="small muted" x="466" y="590" text-anchor="middle">stopped</text>
  <rect class="card" x="528" y="556" width="98" height="42" rx="7"/>
  <text x="577" y="574" text-anchor="middle">#oncall</text>
  <text class="small muted" x="577" y="590" text-anchor="middle">stopped</text>

  <!-- the rule, beside it -->
  <text class="small muted" x="24" y="470">Each side has its own boxes,</text>
  <text class="small muted" x="24" y="488">volume and context secret.</text>
  <text class="small muted" x="24" y="506">A GitHub box never mounts</text>
  <text class="small muted" x="24" y="524">where Slack's threads are</text>
  <text class="small muted" x="24" y="542">kept, and a Slack box never</text>
  <text class="small muted" x="24" y="560">writes where GitHub's are.</text>

  <!-- the volumes -->
  <rect class="ext" x="748" y="444" width="176" height="82" rx="10"/>
  <text class="title" x="836" y="466" text-anchor="middle">GitHub volume</text>
  <text class="small muted" x="836" y="484" text-anchor="middle">botlite-context</text>
  <text class="small" x="836" y="501" text-anchor="middle">sessions/owner/repo/n/</text>
  <text class="small amber" x="836" y="518" text-anchor="middle">context.sealed</text>
  <rect class="ext" x="748" y="538" width="176" height="82" rx="10"/>
  <text class="title" x="836" y="560" text-anchor="middle">Slack volume</text>
  <text class="small muted" x="836" y="578" text-anchor="middle">botlite-slack-context</text>
  <text class="small" x="836" y="595" text-anchor="middle">…/team/chan/ts/[user]/</text>
  <text class="small amber" x="836" y="612" text-anchor="middle">context.sealed</text>

  <!-- GitHub ⇄ controller -->
  <line class="edge" x1="196" y1="100" x2="294" y2="100" marker-end="url(#ah)"/>
  <text class="small" x="246" y="92" text-anchor="middle">poll ≤ 60 s</text>
  <line class="dot" x1="196" y1="128" x2="294" y2="128" marker-end="url(#ah)"/>
  <text class="small" x="246" y="120" text-anchor="middle">push ~1 s</text>
  <line class="edge" x1="296" y1="158" x2="198" y2="158" marker-end="url(#ah)"/>
  <text class="small" x="246" y="150" text-anchor="middle">👀 + reply</text>
  <text class="small muted" x="246" y="176" text-anchor="middle">+ draft PRs</text>

  <!-- Slack ⇄ controller -->
  <line class="edge" x1="196" y1="236" x2="294" y2="236" marker-end="url(#ah)"/>
  <text class="small" x="246" y="228" text-anchor="middle">events ~1 s</text>
  <line class="dot" x1="294" y1="266" x2="198" y2="266" marker-end="url(#ah)"/>
  <text class="small" x="246" y="258" text-anchor="middle">dials out</text>
  <line class="edge" x1="296" y1="300" x2="198" y2="300" marker-end="url(#ah)"/>
  <text class="small" x="246" y="292" text-anchor="middle">👀 + reply</text>

  <!-- controller → chatgpt.com, the team's tools -->
  <line class="secret" x1="636" y1="102" x2="746" y2="102" marker-end="url(#ah-blue)"/>
  <text class="small blue" x="692" y="94" text-anchor="middle">real login</text>
  <line class="secret" x1="636" y1="208" x2="746" y2="208" marker-end="url(#ah-blue)"/>
  <text class="small blue" x="692" y="200" text-anchor="middle">bot's logins</text>

  <!-- controller ⇄ session boxes -->
  <line class="edge" x1="420" y1="336" x2="420" y2="390" marker-end="url(#ah)"/>
  <text class="small" x="410" y="358" text-anchor="end">exec runner, attached</text>
  <text class="small muted" x="410" y="374" text-anchor="end">prompt (+ files) in</text>
  <line class="token" x1="540" y1="392" x2="540" y2="338" marker-end="url(#ah-amber)"/>
  <text class="small amber" x="550" y="358">model · tools · git push</text>
  <text class="small muted" x="550" y="374">+ per-job token</text>

  <!-- each side ⇄ its own volume -->
  <line class="edge" x1="636" y1="485" x2="746" y2="485" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="small" x="692" y="477" text-anchor="middle">seal · restore</text>
  <line class="edge" x1="636" y1="579" x2="746" y2="579" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="small" x="692" y="571" text-anchor="middle">seal · restore</text>
</svg>
